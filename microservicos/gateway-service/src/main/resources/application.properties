server.port=8080
spring.application.name=gateway-service

spring.cloud.gateway.routes[0].id=matricula-service
spring.cloud.gateway.routes[0].uri=${MATRICULA_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/matriculas,/matriculas/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/matriculas(?<segment>/?.*), /api/matriculas$\{segment}

